description = "OSP Phase 1: Internal Compression — extract claims, method, evidence"

prompt = """

# /1-osp-summary — Internal Compression

Extracts the paper's claims, method, and evidence into a structured summary Ŝ that downstream personas rely on.

## Activation

Invoke the `osp-summary-agent` skill. The agent assumes the Summary Agent persona and follows that skill's protocol exactly.

## Prerequisites

- `phases.onboarding.status == "completed"` in `session.json`. If not, refuse and tell the user to run `/0-osp-onboarding`.

## Hard input guard (run BEFORE invoking the persona)

The Summary Agent depends on having a readable text representation of the paper. PDF/DOCX/TEX in `.brain/session/input/` is not enough — silent downstream failures are the #1 risk if the agent receives a binary path.

Before activating the skill, verify in this order:

1. **`.brain/session/input/paper.md` exists and is readable** — ideal case, proceed.
2. **`.brain/session/input/paper.md` is missing but a PDF/DOCX exists** — try to convert it now by running `uvx markitdown <path> > .brain/session/input/paper.md` or using the helper script `python3 .brain/runtime/convert_pdf.py <path> .brain/session/input/paper.md` (or `python3 .brain/runtime\convert_pdf.py <path> .brain/session/input/paper.md` on Windows). Save the result to `.brain/session/input/paper.md`. Update `session.json.paper.parsed_path`.
3. **Conversion fails AND only a PDF/DOCX is present** — refuse to proceed. Print a clear error:
   > Paper at `.brain/session/input/<file>` is in a binary format and conversion failed. Please:
   >   (a) install markitdown: `pip install markitdown` or run with `uvx markitdown`, or
   >   (b) convert the paper manually and place the markdown at `.brain/session/input/paper.md` or `.brain/session/input/paper.txt`.
4. **Nothing in `.brain/session/input/`** — refuse and route to `/0-osp-onboarding`.

Do NOT silently proceed with a PDF path on the assumption that the host tool will handle it. Even if it can, the conversion result becomes part of the audit trail and must be in `.brain/session/input/paper.md`.

## Steps

1. Run the hard input guard above.
2. Read `.brain/session/session.json` and `.brain/session/input/paper.md` (the validated markdown produced or verified by the guard).
3. Activate the `osp-summary-agent` skill — it owns the extraction protocol (claims, method, evidence) and the output format.
4. The skill writes `.brain/session/raw/01_structured_summary.md`.
5. The skill updates `session.json`:
   - `phases.summary.status = "completed"`
   - `phases.summary.completed_at = <now>`
   - `phases.summary.notes = "<N> claims, <M> evidence items, method identified"`
   - `resume_from = "literature"`

## User-facing report (print after completion)

```
── Internal Compression complete ────────────────────────
Extracted <N> claims, <M> pieces of evidence, and the proposed method.
↳ .brain/session/raw/01_structured_summary.md
Next: /2-osp-literature
─────────────────────────────────────────────────────────
```

## Re-run behavior

If `phases.summary.status == "completed"`, warn the user once that re-running will overwrite, then proceed.

"""
